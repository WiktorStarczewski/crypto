# Runs fuzz targets with short execution time for CI smoke testing.
# This is not a replacement for dedicated fuzzing runs, but catches obvious regressions.
# Runs on a schedule (daily) rather than every PR to save CI resources.

name: fuzz

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  fuzz-miden-serde-utils:
    name: fuzz miden-serde-utils (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [primitives, collections, string, vint64, goldilocks, budgeted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@main
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Run fuzz target (smoke test)
        working-directory: miden-serde-utils
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -runs=10000

  fuzz-miden-crypto:
    name: fuzz miden-crypto (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [word, merkle, merkle_store, smt_serde, mmr, crypto, aead, signatures]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@main
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Run fuzz target (smoke test)
        run: |
          fuzz_target="$(cargo +nightly fuzz build --help | awk '
            $0 ~ /^      --target <TRIPLE>/ { in_target = 1; next }
            in_target && /\[default:/ {
              sub(/^.*\[default: /, "")
              sub(/\].*$/, "")
              print
              exit
            }
          ')"
          test -n "$fuzz_target"

          # Build the fuzz target first.
          cargo +nightly fuzz build --target "$fuzz_target" --fuzz-dir miden-crypto-fuzz ${{ matrix.target }}
          # Run directly to avoid cargo-fuzz wrapper SIGPIPE issue
          fuzz_bin="miden-crypto-fuzz/target/$fuzz_target/release/${{ matrix.target }}"
          test -x "$fuzz_bin"
          "$fuzz_bin" -max_total_time=60 -runs=10000
