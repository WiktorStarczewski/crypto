[package]
authors.workspace      = true
categories.workspace   = true
description            = "A unified field element type for on-chain and off-chain Miden Rust code"
documentation          = "https://docs.rs/miden-field"
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
name                   = "miden-field"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lib]
crate-type = ["rlib"]

# dependendies for both off-chain and on-chain targets
[dependencies]
thiserror = { default-features = false, version = "2.0" }

# dependendies for the off-chain target only
[target.'cfg(not(all(target_family = "wasm", miden)))'.dependencies]
miden-serde-utils = { workspace = true }
num-bigint        = { default-features = false, version = "0.4" }
p3-challenger     = { default-features = false, version = "0.5" }
p3-field          = { default-features = false, version = "0.5" }
p3-goldilocks     = { default-features = false, version = "0.5" }
paste             = { version = "1.0.15" }
proptest          = { default-features = false, features = ["alloc", "std"], optional = true, version = "1.7" }
rand              = { default-features = false, version = "0.10" }
serde             = { default-features = false, features = ["derive"], version = "1.0" }
subtle            = { default-features = false, version = "2.6" }

[features]
default = []
testing = ["dep:proptest"]
# When ON and target is wasm32+simd128, `Felt::Packing = PackedFelt` (a 2-lane
# SIMD-packed Felt with `<Felt as Field>::Packing::WIDTH = 2`). On any other
# target / feature configuration, `Felt::Packing = Self` (scalar, WIDTH=1).
# Pure no-op everywhere except wasm32+simd128 with feature ON.
packed-felt-simd128 = []

[dev-dependencies]
proptest = { default-features = false, features = ["alloc", "std"], version = "1.7" }
rand     = { default-features = false, version = "0.10" }
rstest   = { version = "0.26" }

# Wasm-only dev-deps. wasm-bindgen-test makes the wasm32+simd128 tests in
# `native::packed_felt::wasm32_simd128` runnable via
#   wasm-pack test --node -p miden-field --features packed-felt-simd128
# and `js-sys::Date::now()` provides millisecond-resolution timing for the
# arithmetic micro-bench. Native `cargo test` does not pull these in.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen      = "0.2"
wasm-bindgen-test = "0.3"
js-sys            = "0.3"

[lints]
workspace = true
